name: nb-javac

on: [push]
#  push:
#    branches: [ master ]
jobs: 
  linux: 
    name: "nb-javac build and test"
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
            distribution: 'zulu'
            java-version: 25

      - name: Build
        run: ant -f make/langtools/netbeans/nb-javac jar
        
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: make/langtools/netbeans/nb-javac/dist/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

      - name: Test on JDK 17
        run: ant -f make/langtools/netbeans/nb-javac test

      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
            distribution: 'zulu'
            java-version: 21

      - name: Test on JDK 21
        run: ant -f make/langtools/netbeans/nb-javac test


      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
            distribution: 'zulu'
            java-version: 25

      - name: Test on JDK 25
        run: ant -f make/langtools/netbeans/nb-javac test

